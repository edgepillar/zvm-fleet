name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test -json -count=1 ./...

      - name: Build owned Docker probe fixtures
        timeout-minutes: 4
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: |
          test "$(git rev-parse HEAD:zvm-node)" = ae90b945b0ea95887c31cfb2f19e0b88504186d8
          test "$(git -C zvm-node rev-parse HEAD)" = ae90b945b0ea95887c31cfb2f19e0b88504186d8
          fleet_probe_fixture="$RUNNER_TEMP/fleet-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$fleet_probe_fixture"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$fleet_probe_fixture/zvm-probe" github.com/Zenoglyphs-VM/zvm-node/cmd/zvm-node
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$fleet_probe_fixture/helper" ./testdata/probe-fixture
          chmod 0644 "$fleet_probe_fixture/zvm-probe"
          chmod 0755 "$fleet_probe_fixture/helper"

      - name: Run owned Docker SQLite probe
        timeout-minutes: 4
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
          FLEET_OWNED_DOCKER: "1"
        run: go test -json -count=1 -timeout=3m -tags=fleetdocker ./fleet -run '^TestProbeOwnedDockerSQLite$'

      - name: Fuzz exact measurement counters
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -count=1 ./internal/measurement -run '^$' -fuzz '^FuzzMeasurementCounter$' -fuzztime=5s -parallel=1

      # Compile instrumentation outside each campaign's wall-clock budget.
      # Go's build cache is reused; no test binary is exported or uploaded.
      - name: Build Fleet fuzz instrumentation
        timeout-minutes: 6
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -c -o /dev/null ./fleet -fuzz '^FuzzUserTimingExactStatistics$'

      - name: Fuzz exact user timing statistics
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -count=1 ./fleet -run '^$' -fuzz '^FuzzUserTimingExactStatistics$' -fuzztime=5s -parallel=1

      - name: Fuzz user timing wire and cohorts
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -count=1 ./fleet -run '^$' -fuzz '^FuzzUserTimingWireCohorts$' -fuzztime=5s -parallel=1

      - name: Fuzz checked user clock arithmetic
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -count=1 ./fleet -run '^$' -fuzz '^FuzzUserTimingClockArithmetic$' -fuzztime=5s -parallel=1

      - name: Run Fleet measurement race tests
        timeout-minutes: 6
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -race -count=1 ./fleet ./internal/measurement

      - name: Run user report publication race tests
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -race -count=1 ./cmd/zvm-fleet
