name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'tools/doc-check/*.mjs'
      - 'tools/doc-check/package*.json'
      - 'tools/doc-check/manifest.json'
      - 'tools/doc-check/UPSTREAM.json'
      - 'tools/doc-check/.gitignore'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'tools/doc-check/*.mjs'
      - 'tools/doc-check/package*.json'
      - 'tools/doc-check/manifest.json'
      - 'tools/doc-check/UPSTREAM.json'
      - 'tools/doc-check/.gitignore'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - name: Fuzz exact measurement counters
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -count=1 ./internal/measurement -run '^$' -fuzz '^FuzzMeasurementCounter$' -fuzztime=5s -parallel=1

      - name: Run Fleet measurement race tests
        timeout-minutes: 6
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -race -count=1 ./fleet ./internal/measurement

      - name: Run user report publication race tests
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOFLAGS: "-mod=readonly -p=1"
        run: go test -race -count=1 ./cmd/zvm-fleet
