# A local ZVM devnet: everything zvm-fleet drives, on this machine. Ported
# from the deprecated zvm deployment repository; run ./up.sh, not this file.
#
# One compose project: the ZVM's own NoM L1 (chain 70, momentum v1), op-reth
# as the execution engine (zvm-docs spec/DECISIONS.md D2, D3: op-geth was
# retired once both chains were re-genesised onto Karst), and the Go services
# that derive, relay, bridge and serve. Host ports are grouped: 45xxx is the
# L1, 47xxx is the ZVM.
#
# Every service here is in the `v1` profile, which is deprecated with go-zenon
# master: ./up.sh starts docker-compose.dp.yml's dynamic-plasma chain instead.
# The second node (`verify`) runs against v1, so it needs both profiles.

name: zvm

x-znnd-health: &znnd-health
  test:
    - CMD-SHELL
    - >-
      wget -qO- --header='Content-Type: application/json'
      --post-data='{"jsonrpc":"2.0","id":1,"method":"ledger.getFrontierMomentum","params":[]}'
      http://127.0.0.1:35997 | grep -qE '"height":([2-9]|[0-9]{2,})'
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 10s

# reth has no wget/curl, so its healthcheck is bash's own /dev/tcp: a real
# JSON-RPC call, which keeps the `service_healthy` gate every dependent
# service uses instead of relaxing it to `service_started`.
x-reth-health: &reth-health
  test:
    - CMD
    - /bin/bash
    - -c
    - >-
      b='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}';
      exec 3<>/dev/tcp/127.0.0.1/8545 &&
      printf 'POST / HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n\r\n%s' "$${#b}" "$$b" >&3 &&
      grep -q '"result"' <&3
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 10s

services:
  # --- L1: the ZVM's NoM network ------------------------------------------------
  # go-zenon's devnet image with the ZVM's genesis and role configs mounted over
  # the ones it bakes in. A cold network must have exactly one producer before
  # anyone else joins, so the RPC node waits for the pillar to be past genesis.
  l1-pillar:
    image: go-zenon-devnet:latest
    profiles: ["v1"]
    build:
      context: ../go-zenon
      dockerfile: Dockerfile
    container_name: zvm-l1-pillar
    restart: unless-stopped
    environment:
      ZNND_ROLE: pillar
    volumes:
      - ./nom:/devnet:ro
      - l1-pillar-data:/root/.znn
    healthcheck: *znnd-health
    networks:
      l1:
        ipv4_address: 172.28.0.10

  l1-rpc:
    image: go-zenon-devnet:latest
    profiles: ["v1"]
    pull_policy: never
    container_name: zvm-l1-rpc
    restart: unless-stopped
    depends_on:
      l1-pillar:
        condition: service_healthy
    environment:
      ZNND_ROLE: rpc
    ports:
      - "45997:35997" # HTTP JSON-RPC
      - "45998:35998" # WebSocket (point the Syrius extension here)
    volumes:
      - ./nom:/devnet:ro
      - l1-rpc-data:/root/.znn
    healthcheck: *znnd-health
    networks:
      l1:
        ipv4_address: 172.28.0.11
      # Also on the default network, so the ZVM services reach it by name.
      default: {}

  # --- L2: the execution engine -------------------------------------------------
  # op-reth. It never produces a block on its own: the derivation node hands
  # it every block through the Engine API.
  reth:
    image: ghcr.io/paradigmxyz/op-reth:v1.10.2
    profiles: ["v1"]
    container_name: zvm-op-reth
    restart: unless-stopped
    entrypoint: ["op-reth"]
    command:
      - node
      - --chain=/config/genesis.json
      - --datadir=/data
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/config/jwt.hex
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.corsdomain=*
      - --http.api=eth,net,web3,debug,txpool
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.origins=*
      - --ws.api=eth,net,web3,debug,txpool
      - --rollup.sequencer=http://relayer:8547
      - --rollup.disable-tx-pool-gossip
      - --disable-discovery
      # reth has no "unlimited" gas cap the way geth's 0 meant; set to the
      # block gas limit instead. --rpc.txfeecap does document 0 as no cap.
      - --rpc.gascap=300000000
      - --rpc.txfeecap=0
      - -vvv
    healthcheck: *reth-health
    volumes:
      - ./l2:/config:ro
      - op-reth-data:/data
    ports:
      - "47545:8545" # JSON-RPC for wallets (MetaMask / Rabby) and tools
      - "47546:8546" # WebSocket
      - "127.0.0.1:47551:8551" # Engine API, loopback only (for running the deriver on the host)

  # --- the ZVM's own services --------------------------------------------------
  # Each built from its own repository, checked out here as a submodule. The
  # node derives, indexes and serves; the relayer is the batch lane; the bridge
  # is the vault committee; the faucet (zvm-core's CLI) funds both layers.
  node:
    image: zvm-node:latest
    profiles: ["v1"]
    build:
      context: ../zvm-node
    container_name: zvm-node
    restart: unless-stopped
    depends_on:
      reth:
        condition: service_healthy
      l1-rpc:
        condition: service_healthy
    command:
      - node
      - -config=/config/rollup.json
      - -jwt=/config/jwt.hex
      - -l1=http://l1-rpc:35997
      - -engine=http://reth:8551
      - -eth=http://reth:8545
      - -db=/data/zvm.db
      - -listen=:8080
      - -faucet=http://faucet:8549
      - -bridge=http://bridge:8548
      - -relayer=http://relayer:8547
      # Offered to the swap page when `zvm bench setup` has written it; absent
      # is fine, the page then says there is no Uniswap deployment.
      - -dex=/bench/deployment.json
      # The marketplace, collection factory and farm, written by `zvm apps setup`.
      - -apps=/bench/apps.json
      # NFT images and metadata, stored by their own hash. With no -media-url
      # token URIs are /media/<hash>, served by this node; -media-url names a
      # CDN hostname that serves media and nothing else (zvm-docs
      # operations/CDN.md).
      - -media-dir=/data/media
      # /ops sizes the other services' data by walking it: neither execution
      # client nor znnd has an RPC that reports disk. Mounted read-only below.
      - -volumes=engine=/volumes/engine,nom-l1=/volumes/nom-l1
      # Mainnet's height and load, for comparison; read by the node, never the
      # page. Off unless NOM_MAINNET_NODE names a mainnet node.
      - -mainnet-rpc=${NOM_MAINNET_NODE:-off}
      # Compile in the sandboxed verifier below, so this node — which holds the
      # Engine API secret — never runs solc on a stranger's input.
      - -verifier=http://verifier:8600
      # Where a transaction's NoM block can be looked up. This is the stock
      # Zenon explorer, which `--profile l1-explorer` starts on 46000; on
      # mainnet it would be https://explorer.zenon.network (the default there).
      - -l1-explorer=http://localhost:46000
    volumes:
      - ./l2:/config:ro
      - ./bench:/bench:ro
      - node-data:/data
      - op-reth-data:/volumes/engine:ro
      - l1-rpc-data:/volumes/nom-l1:ro
    ports:
      - "47000:8080" # the explorer, the API, and /rpc for wallets
    healthcheck:
      # /healthz answers 503 once derivation has stalled — behind NoM and no
      # longer catching up — so a stuck node is taken out of rotation instead
      # of going on answering from a chain that stopped (zvm-docs operations/HALT.md). A node
      # still working through a long history is behind but healthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # --- the compiler, fenced off ------------------------------------------------
  # Verification recompiles whatever anyone submits, and solc is a large C++
  # program. Filtering its input stops it being asked for the node's files;
  # this stops it reaching them at all. It holds nothing: no volumes of the
  # node's, a read-only root, an unprivileged user, and a scratch tmpfs.
  verifier:
    image: zvm-node:latest
    profiles: ["v1"]
    pull_policy: never
    container_name: zvm-verifier
    restart: unless-stopped
    command:
      - solcd
      - -listen=:8600
      - -solc-dir=/solc
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      # Scratch only, and deliberately noexec (Docker's default): solc compiles
      # in here, and nothing in here may be run.
      - /tmp:size=512m,mode=1777
    volumes:
      # The compiler cache needs exec, which a tmpfs does not give, and keeping
      # it across restarts saves re-fetching every release. It holds nothing but
      # solc builds, each checked against its published SHA-256.
      - verifier-solc:/solc
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8600/status | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  relayer:
    image: zvm-relayer:latest
    profiles: ["v1"]
    build:
      context: ../zvm-relayer
    container_name: zvm-relayer
    restart: unless-stopped
    depends_on:
      reth:
        condition: service_healthy
      l1-rpc:
        condition: service_healthy
    command:
      - relayer
      - -config=/config/rollup.json
      - -l1=http://l1-rpc:35997
      - -eth=http://reth:8545
      - -listen=:8547
    volumes:
      - ./l2:/config:ro
    ports:
      - "47547:8547"

  bridge:
    image: zvm-bridge:latest
    profiles: ["v1"]
    build:
      context: ../zvm-bridge
    container_name: zvm-bridge
    restart: unless-stopped
    depends_on:
      reth:
        condition: service_healthy
      l1-rpc:
        condition: service_healthy
    command:
      - bridge
      - -config=/config/rollup.json
      - -l1=http://l1-rpc:35997
      - -eth=http://reth:8545
      - -db=/data/bridge.db
      - -listen=:8548
      # The withdrawal fee earns QSR; this fuses it to the vault's own plasma,
      # which is what pays for receiving deposits and publishing payouts (D8).
      - -fund-plasma
      - -fund-every=2m
    volumes:
      - ./l2:/config:ro
      - bridge-data:/data
    ports:
      - "47548:8548"

  faucet:
    image: zvm-core:latest
    profiles: ["v1"]
    build:
      context: ../zvm-core
    container_name: zvm-faucet
    restart: unless-stopped
    depends_on:
      reth:
        condition: service_healthy
      l1-rpc:
        condition: service_healthy
    command:
      - faucet
      - -config=/config/rollup.json
      - -l1=http://l1-rpc:35997
      - -eth=http://reth:8545
      - -listen=:8549
    volumes:
      - ./l2:/config:ro
    ports:
      - "47549:8549"

  # --- a second, independent node ----------------------------------------------
  # `docker compose --profile verify up -d` starts another op-reth and another
  # derivation node with their own state, deriving the same NoM history. Then
  # `zvm compare -a http://127.0.0.1:47545 -b http://127.0.0.1:47555` checks
  # that both built the same chain — the claim a based rollup rests on.
  reth-b:
    image: ghcr.io/paradigmxyz/op-reth:v1.10.2
    container_name: zvm-op-reth-b
    profiles: ["verify"]
    restart: unless-stopped
    entrypoint: ["op-reth"]
    command:
      - node
      - --chain=/config/genesis.json
      - --datadir=/data
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/config/jwt.hex
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.corsdomain=*
      - --http.api=eth,net,web3,debug,txpool
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.origins=*
      - --ws.api=eth,net,web3,debug,txpool
      - --rollup.sequencer=http://relayer:8547
      - --rollup.disable-tx-pool-gossip
      - --disable-discovery
      - --rpc.gascap=300000000
      - --rpc.txfeecap=0
      - -vvv
    healthcheck: *reth-health
    volumes:
      - ./l2:/config:ro
      - op-reth-b-data:/data
    ports:
      - "47555:8545"

  node-b:
    image: zvm-node:latest
    pull_policy: never
    container_name: zvm-node-b
    profiles: ["verify"]
    restart: unless-stopped
    depends_on:
      reth-b:
        condition: service_healthy
    command:
      - node
      - -config=/config/rollup.json
      - -jwt=/config/jwt.hex
      - -l1=http://l1-rpc:35997
      - -engine=http://reth-b:8551
      - -eth=http://reth-b:8545
      - -db=/data/zvm.db
      - -no-index
      - -listen=
    volumes:
      - ./l2:/config:ro
      - node-b-data:/data

  # The stock Zenon explorer, for looking at the L1 directly. Off by default:
  # `docker compose --profile l1-explorer up -d`.
  l1-explorer:
    image: go-zenon-devnet-explorer:latest
    build:
      context: ../go-zenon
      dockerfile: docker/explorer/Dockerfile
    container_name: zvm-l1-explorer
    profiles: ["l1-explorer"]
    restart: unless-stopped
    environment:
      EXPLORER_DEFAULT_ENDPOINT: http://localhost:45997
    ports:
      - "46000:80"
    networks:
      - default

networks:
  l1:
    name: zvm-l1
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  verifier-solc:
  l1-pillar-data:
  l1-rpc-data:
  op-reth-data:
  op-reth-b-data:
  node-data:
  node-b-data:
  bridge-data:
